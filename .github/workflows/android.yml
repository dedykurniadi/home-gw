name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homegw-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Job release: hanya jalan saat push tag v*
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             homegw-${{ github.ref_name }}.apk

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HomeGW ${{ github.ref_name }}"
          body: |
            ## HomeGW Android ${{ github.ref_name }}

            APK debug build otomatis dari GitHub Actions.

            ### Cara pasang
            1. Download `homegw-${{ github.ref_name }}.apk`
            2. Aktifkan **Install unknown apps** di Android
            3. Buka file APK → Install

            ### Catatan
            - APK ini *debug build* (tidak di-sign dengan keystore produksi)
            - Pastikan HP terhubung ke jaringan yang sama dengan router
          files: homegw-${{ github.ref_name }}.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
